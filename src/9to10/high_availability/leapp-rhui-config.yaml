rhui:
  use_config : True
  source_clients: [ rh-amazon-rhui-client-ha ]
  target_clients: [ rh-amazon-rhui-client-ha ]
  cloud_provider: aws
  upgrade_files:
    /usr/share/leapp-repository/repositories/system_upgrade/common/files/rhui/aws-ha/rhui-client-config-server-10-ha.crt : /etc/pki/rhui/product/
    /usr/share/leapp-repository/repositories/system_upgrade/common/files/rhui/aws-ha/content-rhel10-ha.crt : /etc/pki/rhui/product/
    /usr/share/leapp-repository/repositories/system_upgrade/common/files/rhui/aws-ha/rhui-client-config-server-10-ha.key : /etc/pki/rhui/
    /usr/share/leapp-repository/repositories/system_upgrade/common/files/rhui/aws-ha/content-rhel10-ha.key : /etc/pki/rhui/
    /usr/share/leapp-repository/repositories/system_upgrade/common/files/rhui/aws-ha/redhat-rhui-ha.repo : /etc/yum.repos.d/
    /usr/share/leapp-repository/repositories/system_upgrade/common/files/rhui/aws-ha/redhat-rhui-client-config-ha.repo : /etc/yum.repos.d/
    /usr/share/leapp-repository/repositories/system_upgrade/common/files/rhui/aws-ha/amazon-id.py : /usr/lib/python3.9/site-packages/dnf-plugins/
  rhui_target_repositories_to_use:
    - rhel-10-appstream-rhui-rpms
    - rhel-10-baseos-rhui-rpms
    - rhel-10-for-x86_64-highavailability-rhui-rpms
    - rhui-client-config-server-10-ha
